# B. 当事人信息（通用，6 项）
- id: B1
  dimension: B
  title: 原告姓名/名称明确
  level: must_fix
  target: whole
  check: regex_any
  patterns: ['原告[（(：:\s]\s*[^，。；\n]{1,30}']
  advice: '"原告"后应紧跟姓名/名称及基本信息'
  basis: 《民诉法解释》第209条（起诉状应记明当事人基本信息）

- id: B2
  dimension: B
  title: 原告身份信息完整
  level: to_confirm
  target: plaintiff
  check: custom:plaintiff_id
  advice: 自然人原告应写明性别、出生日期或身份证号；法人应写明统一社会信用代码与住所地
  basis: 《民诉法解释》第209条

- id: B3
  dimension: B
  title: 被告姓名/名称明确
  level: must_fix
  target: whole
  check: regex_any
  patterns: ['被告[（(：:\s]\s*[^，。；\n]{1,30}']
  advice: '"被告"后应紧跟姓名/名称，不能写"待查""不详"'
  basis: 《民诉法解释》第209条

- id: B4
  dimension: B
  title: 被告信息足以送达
  level: to_confirm
  target: defendant
  check: custom:defendant_sufficient
  advice: 被告段应写明住址/住所地，并提供电话或身份证号，否则法院可能无法送达
  basis: 立案实务（《民诉法解释》第209条）

- id: B5
  dimension: B
  title: 被告身份证号/统一社会信用代码
  level: to_confirm
  target: whole
  check: regex_any
  patterns: ['\d{17}[0-9Xx]', '\d{15}\b', '[0-9A-HJ-NPQRTUWXY]{2}\d{6}[0-9A-HJ-NPQRTUWXY]{10}']
  advice: 提供被告身份证号或统一社会信用代码有助于法院快速查证与送达
  basis: 立案实务

- id: B6
  dimension: B
  title: 原告联系方式
  level: to_confirm
  target: plaintiff
  check: regex_any
  patterns: ['1[3-9]\d{9}', '0\d{2,3}[-—]?\d{7,8}']
  advice: 原告段应留联系电话，便于法院联系
  basis: 立案实务
