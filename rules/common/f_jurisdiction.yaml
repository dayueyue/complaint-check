# F. 管辖（通用 2 项 + 案由辅助）
- id: F1
  dimension: F
  title: 致送法院名称规范
  level: to_confirm
  target: whole
  check: regex_any
  patterns: ['此致\s*\S{1,15}人民法院']
  advice: 致送对象应为具体法院全称（如"北京市海淀区人民法院"），不能只写"法院"或"本院"
  basis: 《民事诉讼法》第122条

- id: F2
  dimension: F
  title: 管辖逻辑提示
  level: suggestion
  target: whole
  check: custom:jurisdiction_card
  cards:
    general: 管辖提示：一般民事案件由被告住所地人民法院管辖（《民事诉讼法》第22条）。
    jiamin: 管辖提示：民间借贷属合同纠纷，可由被告住所地或合同履行地（接收货币一方所在地）人民法院管辖（《民事诉讼法》第24条、《民诉法解释》第18条）。
    maimai: 管辖提示：买卖合同纠纷可由被告住所地或合同履行地人民法院管辖；有书面管辖协议的从其约定，但不得违反级别管辖和专属管辖（《民事诉讼法》第24条、第35条）。
    qinquan: 管辖提示：侵权纠纷由侵权行为地（含侵权结果发生地）或被告住所地人民法院管辖（《民事诉讼法》第29条）。
  advice: 请核对手选立案法院是否符合管辖规则；不确定时优先选择被告住所地法院
  basis: 《民事诉讼法》第22/24/29条
